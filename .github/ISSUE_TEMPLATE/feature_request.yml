name: Feature Request（功能建议）
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 欢迎提出功能建议！请说明真实使用场景，而不仅是想要什么。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 你在学习或科研中遇到了什么痛点？
      placeholder: 作为一名大学生，我在 …… 场景下，希望能够 ……，因为 ……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 关联模块
      options:
        - 复习助手 (Review)
        - 文献研究 (Literature)
        - 数据洞察 (Data Insight)
        - 实验台账 (Experiments)
        - 原理实验室 (Lab)
        - 求职助手 (Career)
        - 项目空间 (Projects)
        - 跨模块 / 平台能力
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与额外上下文
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 SOLVER_AI_MASTER_SPEC.md 中的规划
          required: true
        - label: 我愿意参与该功能的设计或实现
          required: false
