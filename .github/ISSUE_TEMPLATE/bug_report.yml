name: Bug Report（缺陷反馈）
description: 报告一个可复现的产品缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整信息，缺陷复现信息越完整，修复越快。
        安全漏洞请勿在此公开提交，请参考 SECURITY.md 私下披露。
  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 复习助手 (Review)
        - 文献研究 (Literature)
        - 数据洞察 (Data Insight)
        - 实验台账 (Experiments)
        - 原理实验室 (Lab)
        - 求职助手 (Career)
        - 项目空间 (Projects)
        - 认证与账户 (Auth)
        - 基础设施 / 部署 (Infra)
        - 其他 (Other)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 缺陷描述
      description: 实际发生了什么？预期行为是什么？
      placeholder: 实际行为：… 预期行为：…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 上传 '...'
        4. 看到报错 '...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本 / 提交哈希
      placeholder: "例如：v0.2.0 / commit 401dd20"
    validations:
      required: false
  - type: dropdown
    id: ai-mode
    attributes:
      label: AI 运行模式
      options:
        - 本地 Mock 模式（未配置 LLM_API_KEY）
        - 真实云端模型（已配置 LLM_API_KEY）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 控制台 / 服务端日志
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复报告
          required: true
        - label: 我已确认这不是外部 LLM 服务本身的故障
          required: false
